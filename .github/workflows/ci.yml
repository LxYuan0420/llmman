name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            binary: llmman

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            binary: llmman

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            binary: llmman

          # ── Windows x86_64 ────────────────────────────────────────────────
          # lld-link is used instead of MSVC link.exe: it accepts clang's
          # .pdata format (fixing LNK1223) and GNU ar archives (fixing LNK4003).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            binary: llmman.exe
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"

          # ── Windows aarch64 ───────────────────────────────────────────────
          # ARM64 uses the MSVC-native link.exe (put first in PATH by
          # ilammy/msvc-dev-cmd) rather than lld-link: the lld-link in
          # C:\Program Files\LLVM\bin on the ARM64 runner is an x86_64
          # binary running under emulation; it opens ARM64 archives but
          # silently ignores ARM64 COFF objects (machine type mismatch),
          # reporting every CGO export as an undefined symbol.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            binary: llmman.exe
            msvc-arch: arm64
            rustflags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ── Go toolchain ──────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      # ── Go module cache ───────────────────────────────────────────────────
      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.go-os }}-${{ hashFiles('go-shim/go.sum') }}
          restore-keys: go-${{ matrix.go-os }}-

      # ── Windows: set up MSVC with the correct target architecture ─────────
      # msvc-arch is explicit in the matrix so the ARM64 runner gets the ARM64
      # toolchain rather than the default x64, which would cause the wrong
      # assembler to be used when CGO compiles Go's ARM64 runtime stubs.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) ─────────────────────────
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc

      # ── Diagnostics: show which C/linker tools will be used (Windows) ───────
      - name: Show Windows toolchain info
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== clang ===" ; where.exe clang ; clang --version 2>&1 | Select-Object -First 1
          Write-Host "=== lld-link ===" ; where.exe lld-link 2>&1 ; (Get-Command lld-link -ErrorAction SilentlyContinue)?.Source
          Write-Host "=== link ===" ; where.exe link 2>&1 | Select-Object -First 1

      # ── Build (Docker backend, default) ───────────────────────────────────
      - name: Build (docker backend)
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Build (Podman backend) ────────────────────────────────────────────
      # Skipped on Windows: containers/image has no Windows support.
      - name: Build (podman backend)
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features podman
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # ── Diagnostics: inspect the Go shim library on Windows ARM64 ───────────
      - name: Inspect shim library (Windows aarch64)
        if: always() && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Recurse -Path "target" -Filter "llmman_shim.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            Write-Host "Found: $($lib.FullName) ($($lib.Length) bytes)"
            dumpbin /HEADERS "$($lib.FullName)" 2>&1 | Select-Object -First 20
            dumpbin /EXPORTS "$($lib.FullName)" 2>&1 | Select-String "llmman"
          } else {
            Write-Host "llmman_shim.lib NOT FOUND"
          }

      # ── Upload artefacts ──────────────────────────────────────────────────
      - name: Upload binary (docker)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llmman-docker-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Unit tests: every #[cfg(test)] module under src/ (`cargo test --bin`,
  # since this crate has no lib target — see Cargo.toml). Linux x86_64 only:
  # these are pure-Rust logic tests with no OS-specific behavior, so one
  # platform is enough to catch a regression.
  # --------------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: test-x86_64-unknown-linux-gnu

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-linux-${{ hashFiles('go-shim/go.sum') }}
          restore-keys: go-linux-

      - name: Install build dependencies
        run: sudo apt-get install -y gcc

      - name: cargo test --bin llmman
        run: cargo test --release --bin llmman

  # --------------------------------------------------------------------------
  # E2E: `llmman launch <claude|opencode|codex> --model qwen3.5:0.8b`
  # (tests/launch_e2e.rs) against a real `llmman serve`, a real pulled model,
  # a real llama-server, and the real third-party CLIs — not mocks. Mirrors
  # the `build` job's own 5-target matrix exactly (same runners, same
  # msvc-arch/rustflags choices), so the launch/env/config plumbing this
  # actually exercises gets checked on every platform/architecture llmman
  # ships a binary for, not just a subset of them.
  # --------------------------------------------------------------------------
  e2e:
    name: E2E (launch claude/opencode/codex) — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # 25 was set back when this only ever ran on ubuntu-24.04 (a typical
    # run there takes 5-7 minutes total). Confirmed against real
    # windows-2025/windows-11-arm runs that setup+build overhead alone
    # (checkout, toolchains, npm installs, cargo build) already consumes
    # 5-8 of those minutes on Windows, before any of tests/launch_e2e.rs's
    # own three tests even start — and each of those three can, in the
    # worst case, legitimately need up to TIMEOUT (600s each for its own
    # warm_model()/launch calls; only the first test pays warm_model()'s
    # cost, per WARM's own Once). 45 leaves real headroom for that
    # worst case across every platform, not just the fastest one.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            go-os: linux
            llama-asset: llama-b10293-bin-ubuntu-x64.tar.gz

          # ── Linux aarch64 ─────────────────────────────────────────────────
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            go-os: linux
            llama-asset: llama-b10293-bin-ubuntu-arm64.tar.gz

          # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────
          - target: aarch64-apple-darwin
            runner: macos-15
            go-os: darwin
            llama-asset: llama-b10293-bin-macos-arm64.tar.gz

          # ── Windows x86_64 ────────────────────────────────────────────────
          # lld-link, not MSVC link.exe — see the `build` job's own comment
          # on why (same CGO-produced-object-format issue, native build or
          # not).
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            go-os: windows
            llama-asset: llama-b10293-bin-win-cpu-x64.zip
            msvc-arch: amd64
            rustflags: "-C linker=lld-link"

          # ── Windows aarch64 ───────────────────────────────────────────────
          # rustflags empty (MSVC-native link.exe, not lld-link) — see the
          # `build` job's own comment on why this one architecture is the
          # opposite of the x86_64 Windows entry just above.
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            go-os: windows
            llama-asset: llama-b10293-bin-win-cpu-arm64.zip
            msvc-arch: arm64
            rustflags: ""

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-shim/go.sum

      # targets: matches the build job's own Set up Rust step — needed
      # there for genuinely cross-compiled targets, harmless here where
      # every target is actually native.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: e2e-${{ matrix.target }}

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.go-os }}-${{ hashFiles('go-shim/go.sum') }}
          restore-keys: go-${{ matrix.go-os }}-

      # ── Windows: set up MSVC (needed for CGO, same as the `build` job) ────
      # arch: matrix-driven (not a hardcoded amd64) — the ARM64 runner
      # needs the ARM64 toolchain, or CGO compiling Go's ARM64 runtime
      # stubs would use the wrong assembler (see the `build` job's own
      # comment on its identical msvc-arch matrix field).
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: ${{ matrix.msvc-arch }}

      # ── Linux: C compiler (always needed for CGO) + llama-server's own
      # runtime shared-library deps. macOS/Windows need neither: Xcode's
      # command-line tools already provide a C compiler on the macOS
      # runner image, and both platforms' llama-server release archives
      # are fully self-contained (verified via `strings`/load-command
      # inspection — no external libomp/libcurl reference either way).
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgomp1 libcurl4

      # ── Node.js (for the claude/opencode/codex CLIs under test) ────────────
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Each install is tolerated independently (`|| ...`, not `&&`-chained)
      # rather than failing the whole step — and so the whole job — the
      # moment one of these three isn't installable on a given OS: a
      # missing CLI just makes tests/launch_e2e.rs's own on_path check skip
      # that one integration's test instead, exactly as it already does
      # for a developer machine that simply doesn't have e.g. `codex`
      # installed. `shell: bash` (not the Windows default of `pwsh`) is
      # needed on every OS-agnostic step from here on for consistent `||`/
      # multi-line syntax; ubuntu/macOS already default to bash.
      - name: Install integration CLIs (claude, opencode, codex)
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code || echo "::warning::claude-code install failed on ${{ runner.os }}"
          npm install -g opencode-ai || echo "::warning::opencode-ai install failed on ${{ runner.os }}"
          npm install -g @openai/codex || echo "::warning::codex install failed on ${{ runner.os }}"

      # opencode installs its configured provider's npm package (here
      # @ai-sdk/openai-compatible — see launch::opencode_config) on demand
      # into ~/.config/opencode/node_modules the first time a fresh HOME
      # uses it. Pay that cost here, separately diagnosable, instead of
      # inside tests/launch_e2e.rs's own per-launch timeout, so a slow
      # first-time install there can't masquerade as a hung launch.
      #
      # The target baseURL is deliberately unreachable (this only needs to
      # trigger the provider package install, not a real response) — which
      # means this can *only* ever time out, never exit cleanly: opencode's
      # ai-sdk runtime retries a failed connection indefinitely rather than
      # giving up, so there's no successful exit code to wait for once the
      # (fast) npm install itself is done. `timeout` (not the job's own
      # timeout-minutes) enforces a much shorter cap so this doesn't waste
      # CI time being deliberately, permanently unreachable, and `|| true`
      # tolerates the resulting SIGTERM/failure. Also tolerates opencode
      # itself not being installed (see the step above) — `command -v`
      # guards against that rather than failing here instead.
      - name: Warm up opencode's on-demand provider install
        shell: bash
        run: |
          export OPENCODE_CONFIG_CONTENT='{"$schema":"https://opencode.ai/config.json","provider":{"ollama":{"npm":"@ai-sdk/openai-compatible","name":"Ollama","options":{"baseURL":"http://127.0.0.1:1/v1"},"models":{"warmup":{"name":"warmup"}}}},"model":"ollama/warmup"}'
          command -v opencode >/dev/null && timeout 45 opencode run "hi" --print-logs --log-level DEBUG || true

      # ── llama-server (the inference backend `llmman serve` shells out to) ──
      # A prebuilt release straight from upstream llama.cpp, pinned so CI
      # doesn't silently pick up a build that changes behavior mid-flight;
      # bump LLAMA_CPP_RELEASE deliberately when a newer one is needed.
      # `matrix.llama-asset` is this OS/arch's release asset (the Windows
      # one's a .zip, the other two .tar.gz — extracted differently per
      # OS below, see that step's own comment on why). The ubuntu/macOS
      # archives unpack into one llama-<tag> subdirectory; the Windows one
      # doesn't — found dynamically below rather than hardcoding either
      # layout.
      - name: Install llama-server
        shell: bash
        env:
          LLAMA_CPP_RELEASE: b10293
        run: |
          set -euo pipefail
          # $HOME, not $RUNNER_TEMP: on Windows the latter is a native
          # `D:\a\_temp`-style path, and Git Bash's tar.exe (bsdtar) reads
          # the drive letter's colon as its own old rmt "host:path" remote-
          # archive syntax instead ("tar: Cannot connect to D: resolve
          # failed") — confirmed against a real windows-2025 run. $HOME is
          # already the plain POSIX-style path (`/c/Users/...`) Git Bash
          # itself uses throughout, on every OS this runs on.
          #
          # The local filename keeps matrix.llama-asset's own extension
          # (not a fixed generic name) — confirmed directly against a real
          # windows-2025 run that Expand-Archive (see below) determines
          # archive format purely from the filename extension, unlike
          # tar/file, which sniff actual file content: an extension-less
          # name downloaded and byte-for-byte verified as a real zip still
          # got "is not a supported archive file format" from it.
          archive="$HOME/$(basename "${{ matrix.llama-asset }}")"
          curl -fsSL --retry 5 --retry-all-errors -o "$archive" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_CPP_RELEASE}/${{ matrix.llama-asset }}"
          dir="$HOME/llama-cpp"
          mkdir -p "$dir"
          # Windows needs Expand-Archive, not tar -xf: confirmed against a
          # real windows-2025 run that the .zip downloads correctly (right
          # size, and `file` agrees it's a genuine zip) but Git for
          # Windows' bundled tar.exe (bsdtar) still rejects it outright
          # ("This does not look like a tar archive") — that build simply
          # doesn't support the zip format tar/find/cargo's own automatic
          # POSIX<->Windows path translation would otherwise make this a
          # non-issue for. macOS's and Linux's own tar (bsdtar and GNU tar,
          # respectively) both handle their own .tar.gz asset here fine.
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -LiteralPath '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$dir")' -Force"
          else
            tar -xf "$archive" -C "$dir"
          fi
          # Exact names only (not a `llama-server*` glob): the Windows
          # archive also ships a sibling llama-server-impl.dll, which
          # a wildcard would just as happily match first.
          bin=$(find "$dir" -type f \( -iname 'llama-server' -o -iname 'llama-server.exe' \) | head -n1)
          bindir=$(dirname "$bin")
          # $GITHUB_PATH crosses out of this bash step into whatever shell
          # later steps use (pwsh by default on Windows) — which, unlike
          # tar/find/cargo right above, doesn't go through Git Bash's own
          # automatic POSIX<->Windows path translation. A bare Git-Bash
          # path (`/c/Users/...`) written here would be silently useless
          # PATH-wise to that pwsh-run cargo/cargo-test's own child-process
          # spawn, so it's converted to the native `C:\Users\...` form
          # cygpath (bundled with Git for Windows) exists specifically for.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cygpath -w "$bindir" >> "$GITHUB_PATH"
          else
            echo "$bindir" >> "$GITHUB_PATH"
          fi
          # Only Linux needs this: llama-server's shared libraries sit
          # right next to it either way, but macOS's build resolves those
          # via @rpath/@loader_path and Windows' via the same-directory DLL
          # search every EXE already gets for free — neither needs (nor,
          # for DYLD_LIBRARY_PATH under macOS's hardened runtime, reliably
          # even honors) an extra library-search env var the way Linux's
          # dynamic linker does.
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "LD_LIBRARY_PATH=$bindir" >> "$GITHUB_ENV"
          fi

      # --target: matches the build job's own invocation (every one of
      # these is a native build, but explicit --target keeps the output
      # path/build-plan identical to that job's, rather than relying on
      # implicit host-target resolution).
      - name: Build llmman
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # --target here too, for the same reason as the Build llmman step —
      # and RUSTFLAGS needs repeating here too, not just there: this step
      # compiles its own separate test binary (tests/launch_e2e.rs), which
      # links against the exact same Go-shim-produced llmman_shim.lib the
      # main binary does, and hit that same LNK1223 lld-link exists to
      # avoid (see the `build` job's own comment) the first several times
      # this job's Windows entry ran — root-caused to exactly this: the
      # env was present on the Build llmman step above, but this step
      # never inherits another step's `env:` block, and never had its own.
      # LLAMA_ARG_N_GPU_LAYERS=0 on macOS only: llama-server reads this
      # itself (it's the env form of its own --gpu-layers flag), and this
      # process's environment reaches the llama-server subprocess
      # cmd::serve spawns several layers down (llmman launch -> llmman
      # serve -> llama-server, each just inheriting the parent's env by
      # default) without llmman itself needing any change. Root-caused via
      # the new serve.log diagnostic against a real macOS run: this
      # specific pinned llama.cpp release's Metal backend cannot actually
      # run qwen3.5's Gated Delta Net / Flash Attention ops at all ("...
      # assigned to device MTL0 but ... is assigned to device CPU (usually
      # due to missing support)" — logged for both, immediately followed
      # by thousands of "ggml_metal_buffer_get_id: error: tensor '(view)'
      # buffer is nil"), and did in fact crash outright under a real
      # Claude Code prompt's actual size, not this suite's own tiny one —
      # a real, pre-existing llama.cpp/Metal gap for this specific model
      # architecture, not anything about llmman's own code, so forcing
      # pure CPU inference is scoped to this one test's environment,
      # not any change to how llmman itself launches llama-server for
      # real users' models (the overwhelming majority of which have no
      # such issue and would lose real Metal acceleration for nothing).
      - name: cargo test --test launch_e2e
        run: cargo test --release --target ${{ matrix.target }} --test launch_e2e -- --test-threads=1 --nocapture
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          LLAMA_ARG_N_GPU_LAYERS: ${{ matrix.target == 'aarch64-apple-darwin' && '0' || '' }}

      # `llmman serve`'s own stdout/stderr never reach the test's own logs
      # above at all — see daemon::ensure_server's doc comment on why it's
      # detached and redirected to this file instead. A real macOS run
      # failed with the daemon returning a stale port for an already-
      # loaded model ("Connection refused" — the process backing it must
      # have exited without cmd::serve's own `running` map being told),
      # and this file is the only place that could show why (e.g. an
      # unexpected daemon restart, a crashed llama-server, ...) — always
      # run (not just on failure) since a *passing* run's log is useful
      # comparison context for a failing one on another platform/run.
      - name: Show llmman serve.log (diagnostic)
        if: always()
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            log="$LOCALAPPDATA/llmman/serve.log"
          else
            log="$HOME/.local/share/llmman/serve.log"
          fi
          if [ -f "$log" ]; then
            echo "--- $log ---"
            cat "$log"
          else
            echo "no serve.log found at $log"
          fi

  # --------------------------------------------------------------------------
  # Release: attach binaries to GitHub Releases on tag push
  # --------------------------------------------------------------------------
  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: llmman-docker-*
          merge-multiple: false

      - name: Rename binaries for release
        shell: bash
        run: |
          cd dist
          for dir in */; do
            target="${dir%/}"          # e.g. llmman-docker-x86_64-unknown-linux-gnu
            triple="${target#llmman-docker-}"
            src="$dir/llmman"
            [ -f "$dir/llmman.exe" ] && src="$dir/llmman.exe"
            ext="${src##*.}"
            [ "$ext" = "llmman" ] && ext=""  # no extension
            [ "$ext" != "" ] && ext=".$ext"
            cp "$src" "llmman-${triple}${ext}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/llmman-*
